    <path d="M335 261l9-6 8 13 8-17 8 18 9-25 8 39 8-48 8 48 9-40 8 32 8-25 8 15 9-20 8 34 8-45 8 51 9-64 8 75 8-52 8 36 9-17 8 10 8-32 8 43 9-46 8 27 8-15 8 26 9-37 8 45 8-60 8 73 9-99 8 111 8-118 8 112 9-93 8 74 8-60 8 50 9-42 8 34 8-25 8 19 9-12 8 19 8-29 8 38 9-46 8 48 8-40 8 29 9-20 8 12 8-18 8 21 9-16 8 9 8-12 8 17 9-19 8 16 8-10 8 7 9-5 8 5 8-4 8 3" fill="none" stroke="#bff6ab" stroke-width="2"/>

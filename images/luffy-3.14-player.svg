    <text x="40" y="620" font-size="15" fill="#a3a5ae">Saved clips. Original samples. A closer look at the peak.</text><text x="1080" y="620" text-anchor="end" font-size="12" fill="#888f99">Feature illustration</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">LUFFY 3.14 Peak Capture Player feature illustration</title>
  <desc id="desc">A sample clip list, waveform and approximate peak trigger, playback controls, listening gain and output selection. This is an illustrative layout, not a screenshot.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#272c2e"/><stop offset="1" stop-color="#18191e"/></linearGradient></defs>
  <rect x="1" y="1" width="1118" height="658" rx="25" fill="url(#bg)" stroke="#373b42"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="40" y="48" fill="#bff6ab" font-size="13" letter-spacing="2">PEAK CAPTURE → LISTEN BACK → UNDERSTAND</text>
    <rect x="40" y="82" width="1040" height="500" rx="13" fill="#f3f3f3"/>
    <path d="M53 82H1067Q1080 82 1080 95V120H40V95Q40 82 53 82" fill="#ffffff"/>
    <text x="61" y="107" font-size="15" fill="#24262b">LUFFY v3.14 – Peak Capture Player</text>
    <text x="1025" y="108" font-size="20" fill="#656a72">×</text>
    <text x="62" y="153" font-size="17" font-weight="600" fill="#25272c">Saved Peak Captures</text>
    <rect x="60" y="170" width="235" height="31" rx="3" fill="#e6e6e6" stroke="#c6c6c6"/><text x="178" y="191" text-anchor="middle" font-size="13" fill="#25272c">Refresh</text>
    <rect x="60" y="211" width="235" height="301" fill="#ffffff" stroke="#c6c6c6"/>
    <rect x="61" y="220" width="233" height="36" fill="#dcebd6"/>
    <g font-size="12" fill="#31343a"><text x="72" y="243">LUFFY_Peak_example_01.wav</text><text x="72" y="280">LUFFY_Peak_example_02.wav</text><text x="72" y="317">LUFFY_Peak_example_03.wav</text></g>
    <rect x="60" y="526" width="235" height="31" rx="3" fill="#e6e6e6" stroke="#c6c6c6"/><text x="178" y="547" text-anchor="middle" font-size="13" fill="#25272c">Open capture folder</text>
    <text x="322" y="153" font-size="18" font-weight="600" fill="#25272c">LUFFY_Peak_example_01.wav</text>

    <g font-size="13" fill="#25272c" text-anchor="middle"><text x="367" y="387">Previous</text><text x="468" y="387">Pause</text><text x="563" y="387">Stop</text><text x="652" y="387">Next</text></g>
    <text x="322" y="427" font-size="13" fill="#25272c">Listening gain (WAV remains unchanged)</text><text x="901" y="427" font-size="13" fill="#25272c">0 dB</text>

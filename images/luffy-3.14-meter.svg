<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">LUFFY True Peak warning around an entire monitor</title>
  <desc id="desc">A neutral desktop monitor with a small LUFFY meter at the bottom. The red warning follows all four display edges when True Peak crosses the limit.</desc>
  <!-- Physical monitor and stand distinguish the display from an app window. -->
  <path d="M346 448H414L426 488H334Z" fill="#303237" stroke="#4a4c51"/>
  <rect x="264" y="487" width="232" height="12" rx="5" fill="#3c3e43"/>
  <rect x="20" y="18" width="720" height="434" rx="13" fill="#25272b" stroke="#55585e" stroke-width="2"/>
  <rect x="35" y="33" width="690" height="394" fill="#111316"/>
  <circle cx="380" cy="439" r="2" fill="#72777e"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <!-- LUFFY is a small separate window, not the container for the red frame. -->
    <rect x="157" y="357" width="446" height="48" rx="7" fill="#292c32" stroke="#50545d"/>
    <text x="380" y="372" text-anchor="middle" fill="#b0b6c0" font-size="9">LUFFY v3.14</text>
    <g fill="#bfd8ad"><rect x="171" y="382" width="3" height="12"/><rect x="177" y="386" width="3" height="8"/></g>
    <g font-size="13" font-weight="600"><text x="191" y="393" fill="#bfd8ad">I −13.8</text><text x="267" y="393" fill="#e6e7e5">S −18.7</text><text x="348" y="393" fill="#f49d96">TP −0.4</text><text x="435" y="393" fill="#e6e7e5">1:58</text></g>
    <g fill="#e6e7e5"><rect x="493" y="382" width="3" height="11"/><rect x="499" y="382" width="3" height="11"/></g>
    <text x="528" y="395" fill="#e6e7e5" font-size="19">↻</text><text x="571" y="393" fill="#e6e7e5" font-size="17">⚙</text>
  </g>
  <!-- Warning follows the entire active display, not the meter or workspace. -->
  <rect x="38" y="36" width="684" height="388" rx="1" fill="none" stroke="#f16d64" stroke-width="5"/>
</svg>

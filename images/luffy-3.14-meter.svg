<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">LUFFY 3.14 compact meter illustration</title>
  <desc id="desc">Example loudness readings, stereo peak bars and controls. An illustration, not a screenshot.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#30363a"/><stop offset="1" stop-color="#17191e"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
    <filter id="shadow" x="-30%" y="-100%" width="160%" height="400%"><feDropShadow dy="20" stdDeviation="20" flood-opacity=".5"/></filter>
  </defs>
  <rect x="1" y="1" width="758" height="598" rx="28" fill="url(#bg)" stroke="#373b42"/>
  <rect x="1" y="1" width="758" height="598" rx="28" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="45" cy="47" r="5" fill="#bff6ab"/><text x="62" y="52" fill="#bff6ab" font-size="13" letter-spacing="2">SMALL WINDOW. USEFUL DETAIL.</text>
    <rect x="40" y="113" width="680" height="275" rx="17" fill="none" stroke="#f16d64" stroke-opacity=".75" stroke-width="2"/>
    <circle cx="65" cy="140" r="4" fill="#f16d64"/><text x="78" y="145" fill="#f49d96" font-size="12" letter-spacing="1">SCREEN-EDGE TRUE PEAK WARNING</text>
    <g filter="url(#shadow)">
      <rect x="70" y="224" width="620" height="84" rx="17" fill="#222429" stroke="#41444b"/>
      <text x="380" y="248" text-anchor="middle" fill="#aeb4bf" font-size="12" font-weight="700">LUFFY v3.14</text>
      <g fill="#46494f"><rect x="89" y="266" width="4" height="24"/><rect x="96" y="266" width="4" height="24"/></g>
      <g fill="#79e8b4"><rect x="89" y="270" width="4" height="20"/><rect x="96" y="275" width="4" height="15"/></g>
      <g font-size="21" font-weight="600"><text x="116" y="286" fill="#79e8b4">I −13.8</text><text x="221" y="286" fill="#f6f7f8">S −18.7</text><text x="337" y="286" fill="#f6f7f8">TP −2.8</text><text x="461" y="286" fill="#f6f7f8">1:58</text></g>
      <g fill="#e9ebee"><rect x="540" y="270" width="4" height="17" rx="1"/><rect x="548" y="270" width="4" height="17" rx="1"/></g>
      <text x="574" y="288" fill="#e9ebee" font-size="27">↻</text><text x="625" y="286" fill="#e9ebee" font-size="24">⚙</text>
    </g>
    <g fill="none" stroke="#757c85"><path d="M95 315V344H168"/><path d="M377 315V358H460"/></g>
    <text x="174" y="349" fill="#aeb4bf" font-size="13">L / R peak bars</text><text x="466" y="363" fill="#aeb4bf" font-size="13">LUFS + True Peak</text>
    <text x="45" y="456" fill="#f7f8f5" font-size="30" font-weight="650">Your levels, close at hand.</text>
    <text x="45" y="491" fill="#a3a5ae" font-size="17">Live metering · custom targets · pause &amp; reset</text>
    <rect x="45" y="529" width="105" height="28" rx="14" fill="#bff6ab" fill-opacity=".12"/><text x="97" y="548" text-anchor="middle" fill="#bff6ab" font-size="12">3.14 BETA</text>
    <text x="710" y="550" text-anchor="end" fill="#888f99" font-size="12">Illustration · example values</text>
  </g>
</svg>
